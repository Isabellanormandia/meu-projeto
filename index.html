<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Meu Projeto</title>

</head>
<body>
    <div id="conteudo">

    </div>

    <h1 id="mensagemFinal" class="hidden">Parabéns jogador(a)! Até a próxima.</h1>

    <script src="app.js"></script>
